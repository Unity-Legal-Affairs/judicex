name: Python tests

on:
  push:
    branches: ["Iran-legal"]
  pull_request:
    branches: ["Iran-legal"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[crypto,server]"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend JavaScript syntax
        run: node --check judicex_memory_os/static/app.js
      - name: Check Android shell scripts
        run: bash -n deploy/android/install.sh deploy/android/start.sh deploy/android/backup.sh
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
